<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站收录</title>
    <link rel="stylesheet" href="css/tailwind.css?v=20260909">
    <script src="js/ai-search.js?v=20260909"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors duration-300">
    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- 左侧导航栏 -->
        <aside class="w-full md:w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 p-4 md:sticky md:top-0 md:h-screen overflow-y-auto">
            <div class="flex items-center justify-between mb-6 slide-up">
                <h1 class="text-xl font-bold text-primary flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-500 hover:rotate-12"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg>
                    <span class="transition-all duration-300 hover:scale-105">网站收录</span>
                </h1>
                <button id="mobile-menu-button" class="md:hidden text-gray-500 dark:text-gray-400 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-all duration-300 hover:scale-110">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
                </button>
            </div>
            
            <div id="nav-container" class="space-y-1">
                <div class="nav-item active slide-in nav-transition" data-category="all" style="animation-delay: 0.1s;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    <span>全部网站</span>
                    <span class="ml-auto bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs px-2 py-1 rounded-full" id="count-all"></span>
                </div>
                <!-- 分类导航将通过JavaScript动态生成 -->
            </div>
            
            <!-- 我的收藏（独立分组） -->
            <div class="mt-6 pt-6 border-t border-gray-200 dark:border-gray-700">
                <div class="nav-item nav-transition cursor-pointer" data-category="favorites">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    <span>我的收藏</span>
                    <span class="ml-auto bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs px-2 py-1 rounded-full" id="count-favorites">0</span>
                </div>
                <!-- 收藏导入导出 -->
                <div class="flex gap-1 mt-1 px-3">
                    <button id="fav-export" class="flex-1 text-xs text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary-light py-1 transition-colors" title="导出收藏为 JSON 文件">导出</button>
                    <span class="text-gray-300 dark:text-gray-600 py-1">·</span>
                    <button id="fav-import" class="flex-1 text-xs text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary-light py-1 transition-colors" title="从 JSON 文件导入收藏">导入</button>
                    <input type="file" id="fav-import-file" accept=".json" class="hidden">
                </div>
            </div>
            
            <!-- 小马宝莉分类 -->
            <div class="mt-6 pt-6 border-t border-gray-200 dark:border-gray-700">
                <a href="mlp.html" class="nav-item slide-in nav-transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    <span>小马宝莉</span>
                    <span class="ml-auto bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs px-2 py-1 rounded-full">100+</span>
                </a>
            </div>
            
            <!-- 返回按钮 -->
            <div class="mt-6">
                <button onclick="window.location.href='https://blog.goldenapplepie.xyz/'" class="nav-item slide-in nav-transition w-full">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 12-7-7-7 7"/><path d="M12 19V5"/></svg>
                    <span>返回</span>
                </button>
            </div>
            
        </aside>
        
        <!-- 主内容区 -->
        <main class="flex-1 p-4 md:p-8">
            <!-- 顶部搜索栏 -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm p-4 mb-6 fade-in border border-gray-200 dark:border-gray-700">
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1">
                        <div class="relative">
                            <input type="text" id="search-input" placeholder="搜索网站..." 
                                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100 rounded-lg focus:outline-none search-focus transition-all duration-300 focus:shadow-md">
                            <button id="search-button" class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-primary dark:hover:text-primary-light p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-all duration-300 hover:scale-110">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                            </button>
                        </div>
                    </div>
                    
                    <!-- 右侧工具栏：随机跳站 + 暗色切换 -->
                    <div class="flex items-center gap-2 shrink-0">
                        <!-- 随机跳站 -->
                        <button id="random-jump" class="inline-flex items-center gap-2 px-4 py-2 bg-primary hover:bg-primary-dark text-white rounded-lg transition-all duration-300 hover:shadow-md hover:-translate-y-0.5" title="随机打开一个网站">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M16 8h.01"/><path d="M8 8h.01"/><path d="M12 12h.01"/><path d="M16 16h.01"/><path d="M8 16h.01"/><path d="M12 12h.01"/><path d="m2 2 20 20"/><path d="M3 8h5"/><path d="M9 15v-2"/><path d="M15 9V7"/><path d="M21 11c0-.6-.4-1-1-1h-3"/></svg>
                            <span class="hidden sm:inline">随机跳站</span>
                        </button>
                        <!-- 暗色切换 -->
                        <button id="theme-toggle" class="p-2 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary-light hover:border-primary dark:hover:border-primary transition-all duration-300" title="切换主题">
                            <!-- 亮色模式下显示月亮（点它切暗色） -->
                            <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                            <!-- 暗色模式下显示太阳（点它切亮色） -->
                            <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                        </button>
                    </div>

                </div>
            </div>
            
            <!-- 面包屑导航 -->
            <div class="flex items-center gap-2 mb-4 text-sm text-gray-500" id="breadcrumb"></div>
            
            <!-- 分类标签 -->
            <div class="flex flex-wrap gap-2 mb-6 fade-in" style="animation-delay: 0.2s;" id="category-tags">
                <button class="px-3 py-1 bg-primary text-white rounded-full text-sm tag-hover">全部</button>
                <!-- 分类标签将通过JavaScript动态生成 -->
            </div>
            
            <!-- 网站卡片网格 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="website-grid">
                <!-- 网站卡片将通过JavaScript动态生成 -->
                <div class="col-span-full flex justify-center items-center py-20">
                        <div class="text-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin text-gray-400 mb-4"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                            <p class="text-gray-500">加载中...</p>
                        </div>
                    </div>
            </div>
            <!-- 分页控件容器 -->
            <div id="pagination-container"></div>
        </main>
    </div>
    

    
    <!-- AI 悬浮球 -->
    <button id="ai-button" aria-label="AI 智能搜索"
        style="position:fixed; right:1.5rem; bottom:5rem; z-index:9999; width:42px; height:42px;"
        class="rounded-full bg-primary text-white shadow-md transition-all duration-300 hover:scale-110 hover:shadow-lg animate-ai-float">
        <!-- 外层呼吸光圈 -->
        <span style="position:absolute; inset:0;" class="rounded-full bg-primary/30 animate-ai-ping"></span>
        <!-- 图标 -->
        <span style="display:flex; align-items:center; justify-content:center; width:100%; height:100%;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        </span>
    </button>

    <!-- 回到顶端 -->
    <button id="back-to-top" aria-label="回到顶端"
        style="position:fixed; right:1.5rem; bottom:1.5rem; z-index:9999; width:42px; height:42px;"
        class="rounded-full bg-primary text-white shadow-md transition-all duration-300 hover:scale-110 hover:shadow-lg">
        <span style="display:flex; align-items:center; justify-content:center; width:100%; height:100%;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
        </span>
    </button>
    
    <!-- AI 语义搜索弹窗 -->
    <div id="ai-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
        <!-- 遮罩 -->
        <div id="ai-modal-backdrop" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
        
        <!-- 弹窗主体 -->
        <div class="relative w-full max-w-xl max-h-[80vh] bg-white dark:bg-gray-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-fade-up">
            <!-- 头部 -->
            <div class="flex items-center gap-3 px-6 py-4 border-b border-gray-200 dark:border-gray-700">
                <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                </div>
                <div>
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100">AI 智能推荐</h3>
                    <p class="text-xs text-gray-500 dark:text-gray-400">用自然语言描述你想做什么，AI 帮你找网站</p>
                </div>
                <button id="ai-settings-btn" class="ml-auto p-2 rounded-lg text-gray-400 hover:text-primary dark:hover:text-primary-light hover:bg-purple-50 dark:hover:bg-primary/20 transition-colors" title="AI 设置（API Key / 模型）">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <button id="ai-modal-close" class="p-2 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            
            <!-- 输入区 -->
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
                <!-- textarea + 搜索按钮 同一行 -->
                <div class="flex items-start gap-3">
                    <textarea id="ai-input" rows="2" 
                        class="flex-1 px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-600 rounded-xl text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent resize-none transition-all"
                        placeholder="比如：我想把视频里的 BGM 去掉，或者 有没有免费的 AI 写作助手？"></textarea>
                    <button id="ai-submit" 
                        class="shrink-0 h-[46px] px-5 bg-primary hover:bg-primary-dark text-white text-sm font-medium rounded-xl transition-all hover:shadow-md hover:-translate-y-0.5">
                        AI 搜索
                    </button>
                </div>
                <!-- 快速示例标签 -->
                <div class="mt-3 flex flex-wrap gap-2 items-center">
                    <span class="text-xs text-gray-400 dark:text-gray-500 shrink-0">试试：</span>
                    <button class="ai-example text-xs px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-primary-bg dark:hover:bg-primary/30 hover:text-primary-dark dark:hover:text-primary-light transition-colors">去掉视频里的声音</button>
                    <button class="ai-example text-xs px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-primary-bg dark:hover:bg-primary/30 hover:text-primary-dark dark:hover:text-primary-light transition-colors">免费 AI 写作助手</button>
                    <button class="ai-example text-xs px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-primary-bg dark:hover:bg-primary/30 hover:text-primary-dark dark:hover:text-primary-light transition-colors">图片抠图去背景</button>
                    <button class="ai-example text-xs px-2 py-1 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-primary-bg dark:hover:bg-primary/30 hover:text-primary-dark dark:hover:text-primary-light transition-colors">mc 服务器工具</button>
                </div>
            </div>
            
            <!-- 结果区 -->
            <div id="ai-results" class="flex-1 overflow-y-auto px-6 py-4">
                <!-- 初始提示 -->
                <div id="ai-placeholder" class="flex flex-col items-center justify-center h-full text-center py-10">
                    <div class="w-16 h-16 rounded-2xl bg-primary-bg dark:bg-primary flex items-center justify-center mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M22 2 12 12"/></svg>
                    </div>
                    <p class="text-gray-500 dark:text-gray-400">输入你想做的事，AI 帮你找到合适的网站</p>
                    <p class="text-xs text-gray-400 dark:text-gray-500 mt-2">已索引 <span id="ai-index-count">0</span> 个网站</p>
                </div>
                <!-- 结果列表由 JS 动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let allWebsites = [];
        let currentCategory = 'all';
        let searchQuery = '';
        let categoryNames = {}; // 存储分类名称映射
        let searchHistory = []; // 搜索历史
        const MAX_HISTORY_ITEMS = 10; // 最大历史记录数
        
        // 收藏相关
        let favorites = JSON.parse(localStorage.getItem('links-favorites') || '[]'); // URL 数组
        
        // 分页相关状态
        let currentPage = 1;
        let itemsPerPage = 24;
        let filteredList = []; // 当前筛选+排序后的完整列表（分页从这里面切片）
        
        // ============ 辅助函数 ============
        
        // 从 URL 提取域名
        function getDomain(url) {
            try {
                return new URL(url).hostname;
            } catch (e) {
                return '';
            }
        }
        
        // 获取网站 favicon（使用 icon.horse 服务，支持回退）
        function getFaviconUrl(url) {
            const domain = getDomain(url);
            if (!domain) return '';
            return `https://icon.horse/icon/${domain}`;
        }
        
        // 收藏操作
        function isFavorite(url) {
            return favorites.includes(url);
        }
        function toggleFavorite(url) {
            if (isFavorite(url)) {
                favorites = favorites.filter(u => u !== url);
            } else {
                favorites.push(url);
            }
            localStorage.setItem('links-favorites', JSON.stringify(favorites));
            updateFavoritesCount();
        }
        function updateFavoritesCount() {
            document.getElementById('count-favorites').textContent = favorites.length;
        }
        
        // 初始化函数
        async function init() {
            try {
                // 加载所有JSON文件
                await loadAllJsonFiles();
                // 更新全部网站数量
                document.getElementById('count-all').textContent = allWebsites.length;
                // 更新收藏计数
                updateFavoritesCount();
                // 生成导航菜单
                generateNavigation();
                // 生成分类标签
                generateCategoryTags();
                // 渲染网站卡片（含分页）
                applyFilter();
                // 构建 AI 语义搜索索引
                if (window.SemanticSearch) {
                    SemanticSearch.build(allWebsites);
                    const count = document.getElementById('ai-index-count');
                    if (count) count.textContent = allWebsites.length;
                }
            } catch (error) {
                console.error('初始化失败:', error);
                document.getElementById('website-grid').innerHTML = `
                    <div class="col-span-full flex justify-center items-center py-20">
                        <div class="text-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-500 mb-4"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
                            <p class="text-red-500">加载失败，请刷新页面重试</p>
                            <p class="text-sm text-gray-500 mt-2">${error.message}</p>
                        </div>
                    </div>
                `;
            }
        }
        
        // 加载所有JSON文件
        async function loadAllJsonFiles() {
            const jsonFiles = [
                'json/ai.json',
                'json/other.json',
                'json/mc.json',
                'json/music.json',
                'json/science.json'
            ];
            
            for (const file of jsonFiles) {
                try {
                    const response = await fetch(file);
                    if (!response.ok) {
                        throw new Error(`无法加载 ${file}`);
                    }
                    
                    const data = await response.json();
                    const categoryKey = file.split('/')[1].replace('.json', '');
                    
                    // 提取分类名称
                    if (data.class_name) {
                        categoryNames[categoryKey] = data.class_name;
                    } else {
                        // 默认使用首字母大写的分类名
                        categoryNames[categoryKey] = categoryKey.charAt(0).toUpperCase() + categoryKey.slice(1);
                    }
                    
                    // 处理不同格式的JSON文件
                    if (data.categories) {
                        // science.json格式

                    } else if (data.websites && Array.isArray(data.websites)) {

                    website.description.toLowerCase().includes(query) ||
                    website.url.toLowerCase().includes(query)

        // 渲染分页栏（含每页条数自定义）
        function renderPagination() {
            const container = document.getElementById('pagination-container');
            const total = filteredList.length;
            const totalPages = Math.max(1, Math.ceil(total / itemsPerPage));
            if (currentPage > totalPages) currentPage = totalPages;
            
            if (total === 0) {
                container.innerHTML = '';
                return;
            }
            
            // 生成页码（多页时折叠中间部分）
            let pages = [];
            if (totalPages <= 7) {
                pages = Array.from({ length: totalPages }, (_, i) => i + 1);
            } else {
                pages.push(1);
                if (currentPage > 3) pages.push('...');
                const from = Math.max(2, currentPage - 1);
                const to = Math.min(totalPages - 1, currentPage + 1);
                for (let p = from; p <= to; p++) pages.push(p);
                if (currentPage < totalPages - 2) pages.push('...');
                pages.push(totalPages);
            }
            
            const pageBtns = pages.map(p => {
                if (p === '...') return `<span class="px-2 py-1 text-gray-400 select-none">…</span>`;
                const active = p === currentPage;
                return `<button data-page="${p}" class="px-3 py-1 rounded-lg text-sm transition-all duration-200 ${active ? 'bg-primary text-white font-medium' : 'bg-white border border-gray-200 text-gray-700 hover:bg-gray-100'}">${p}</button>`;
            }).join('');
            
            container.innerHTML = `
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mt-8 pb-4 fade-in">
                    <div class="flex items-center gap-2 text-sm text-gray-600">
                        <span>每页</span>
                        <input id="items-per-page" type="number" min="1" max="999" value="${itemsPerPage}"
                            class="w-16 px-2 py-1 border border-gray-300 rounded-lg text-center focus:outline-none search-focus transition-all duration-300">
                        <span>条</span>
                        <span class="ml-2 text-gray-400">共 ${total} 条 · 第 ${currentPage}/${totalPages} 页</span>
                    </div>
                    <div class="flex items-center gap-1 flex-wrap justify-center" id="page-controls">
                        <button data-page="prev" ${currentPage <= 1 ? 'disabled' : ''}
                            class="px-3 py-1 rounded-lg text-sm bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-200">上一页</button>
                        ${pageBtns}
                        <button data-page="next" ${currentPage >= totalPages ? 'disabled' : ''}
                            class="px-3 py-1 rounded-lg text-sm bg-white border border-gray-200 text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-200">下一页</button>
                    </div>
                </div>
            `;
            
            // 绑定页码 / 上下页事件
            container.querySelectorAll('#page-controls button[data-page]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const v = btn.dataset.page;
                    if (v === 'prev') {
                        if (currentPage > 1) currentPage--;
                    } else if (v === 'next') {
                        if (currentPage < totalPages) currentPage++;
                    } else {
                        currentPage = parseInt(v, 10);
                    }
                    renderWebsites();
                    document.getElementById('website-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });
            
            // 绑定每页条数自定义
            const ipp = container.querySelector('#items-per-page');
            if (ipp) {
                ipp.addEventListener('change', () => {
                    let v = parseInt(ipp.value, 10);
                    if (isNaN(v) || v < 1) v = 1;
                    if (v > 999) v = 999;
                    itemsPerPage = v;
                    currentPage = 1;
                    renderWebsites();
                });
            }
        }

        // ============ 卡片悬停预览（二维码） ============
        function showCardPreview(card) {
            // 先关掉旧的
            hideCardPreview();
            
            const url = card.dataset.url;
            const website = filteredList.find(w => w.url === url) || allWebsites.find(w => w.url === url);
            if (!website) return;
            
            const rect = card.getBoundingClientRect();
            const preview = document.createElement('div');
            preview.className = 'card-preview fixed bg-white border border-gray-200 rounded-lg shadow-xl p-3 z-[99998]';
            preview.dataset.targetUrl = url;
            
            const domain = getDomain(url);
            const favicon = getFaviconUrl(url);
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(url)}`;
            
            preview.innerHTML = `
                <div class="text-center">
                    <div class="flex items-center justify-center gap-2 mb-2">
                        ${favicon ? `<img src="${favicon}" width="20" height="20" class="rounded object-contain bg-gray-50" onerror="this.style.display='none'">` : ''}
                        <span class="font-medium text-sm text-gray-900 max-w-[200px] truncate">${website.name}</span>
                    </div>
                    <img src="${qrUrl}" alt="QR" width="160" height="160" class="rounded border border-gray-100 bg-white">
                    <div class="text-xs text-gray-400 mt-2 truncate max-w-[160px] mx-auto" title="${domain}">${domain}</div>
                </div>
            `;
            
            // 计算位置：优先放卡片右侧，空间不够则放左侧
            preview.style.width = 'auto';
            document.body.appendChild(preview);
            const pw = preview.offsetWidth;
            const ph = preview.offsetHeight;
            let left = rect.right + 12;
            let top = rect.top + (rect.height - ph) / 2;
            if (left + pw > window.innerWidth - 8) {
                left = rect.left - pw - 12; // 翻转到左侧
            }
            if (left < 8) left = 8;
            if (top < 8) top = 8;
            if (top + ph > window.innerHeight - 8) top = window.innerHeight - ph - 8;
            
            preview.style.left = left + 'px';
            preview.style.top = top + 'px';
        }
        
        function hideCardPreview() {
            document.querySelectorAll('.card-preview').forEach(el => el.remove());
        }
        
        // 搜索历史管理
        function addToSearchHistory(query) {
            if (!query || query.trim() === '') return;
            
            // 移除重复项
            searchHistory = searchHistory.filter(item => item !== query);
            
            // 添加到开头
            searchHistory.unshift(query);
            
            // 限制历史记录数量
            if (searchHistory.length > MAX_HISTORY_ITEMS) {
                searchHistory = searchHistory.slice(0, MAX_HISTORY_ITEMS);
            }
        }
        
        // 获取搜索建议
        function getSearchSuggestions(query) {
            if (!query || query.trim() === '') return [];
            
            const queryLower = query.toLowerCase();
            const suggestions = new Set();
            
            // 从网站名称和描述中提取建议
            allWebsites.forEach(website => {
                if (website.name.toLowerCase().includes(queryLower)) {
                    suggestions.add(website.name);
                }
                if (website.description.toLowerCase().includes(queryLower)) {
                    suggestions.add(website.description.substring(0, 50));
                }
            });
            
            // 从搜索历史中提取建议
            searchHistory.forEach(item => {
                if (item.toLowerCase().includes(queryLower)) {
                    suggestions.add(item);
                }
            });
            
            return Array.from(suggestions).slice(0, 5); // 最多返回5个建议
        }
        
        // 渲染搜索建议
        function renderSearchSuggestions(query) {
            const suggestions = getSearchSuggestions(query);
            const searchInput = document.getElementById('search-input');
            
            // 移除旧的建议（直接从 body 移除）
            document.querySelectorAll('.search-suggestions').forEach(el => el.remove());
            
            if (suggestions.length === 0) return;
            
            // 计算搜索框相对于视口的位置
            const rect = searchInput.getBoundingClientRect();
            
            // 创建建议框，挂载到 body，用 fixed 定位 + 超高 z-index
            const suggestionBox = document.createElement('div');
            suggestionBox.className = 'search-suggestions fixed bg-white border border-gray-200 rounded-lg shadow-lg z-[99999]';
            suggestionBox.style.top = (rect.bottom + 4) + 'px';   // 紧贴搜索框下方
            suggestionBox.style.left = rect.left + 'px';
            suggestionBox.style.width = rect.width + 'px';
            
            suggestions.forEach(suggestion => {
                const item = document.createElement('div');
                item.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer';
                item.textContent = suggestion;
                item.addEventListener('click', () => {

        // ============ 主题切换 ============
        const THEME_KEY = 'links-theme';
        function applyTheme(dark) {
            const html = document.documentElement;
            const sun = document.getElementById('theme-icon-sun');   // 亮时隐藏，暗时显示
            const moon = document.getElementById('theme-icon-moon'); // 亮时显示，暗时隐藏
            if (dark) {
                html.classList.add('dark');
                sun.classList.remove('hidden');
                moon.classList.add('hidden');
            } else {
                html.classList.remove('dark');
                sun.classList.add('hidden');
                moon.classList.remove('hidden');
            }
        }
        function initTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved === 'dark') {
                applyTheme(true);
            } else if (saved === 'light') {
                applyTheme(false);
            } else {
                // 未设置则跟随系统
                applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
            }
        }
        initTheme();
        
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const dark = !document.documentElement.classList.contains('dark');

            const site = filteredList[Math.floor(Math.random() * filteredList.length)];

                return;
            }
            const data = {
                version: 1,
                exportedAt: new Date().toISOString(),
                count: favorites.length,
                urls: favorites
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `links-favorites-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);

            if (!file) return;
            try {
                const text = await file.text();
                const data = JSON.parse(text);
                let imported = [];
                if (Array.isArray(data)) {
                    // 直接是数组的老格式
                    imported = data;
                } else if (data.urls && Array.isArray(data.urls)) {
                    imported = data.urls;
                }
                // 合并去重
                const before = favorites.length;
                const merged = [...new Set([...favorites, ...imported.filter(u => typeof u === 'string')])];
                favorites = merged;
                localStorage.setItem('links-favorites', JSON.stringify(favorites));
                updateFavoritesCount();
                const added = favorites.length - before;
                alert(`导入完成！新增 ${added} 个，合计 ${favorites.length} 个收藏`);

            panel.querySelector('#ai-setting-clear').addEventListener('click', () => {
                const old = window.LLMRecRank.settings;
                old.apiKey = '';
                window.LLMRecRank.settings = old;
                // 清空所有 apiKey 输入框
                panel.querySelectorAll('#ai-f-apiKey').forEach(i => i.value = '');
            });
        }
        
        // 示例按钮
        document.querySelectorAll('.ai-example').forEach(btn => {
            btn.addEventListener('click', () => {
                aiInput.value = btn.textContent.trim();
                aiInput.focus();
                runAISearch();
            });
        });
        
        // 提交搜索
        document.getElementById('ai-submit').addEventListener('click', runAISearch);
        aiInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runAISearch();
            }
        });
        
        async function runAISearch() {
            const query = aiInput.value.trim();
            if (!query) return;
            
            // 显示加载状态
            aiResults.innerHTML = `
                <div class="flex flex-col items-center justify-center py-10 text-center">
                    <div class="w-10 h-10 border-3 border-primary border-t-transparent rounded-full animate-spin mb-3"></div>
                    <p class="text-sm text-gray-500 dark:text-gray-400">AI 正在搜索...</p>
                </div>`;
            
            try {
                const result = await AISearch.search(query);
                renderAIResults(result, query);
            } catch (err) {
                aiResults.innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-red-500">搜索出错了</p>
                        <p class="text-xs text-gray-400 mt-2">${err.message}</p>
                    </div>`;
            }
        }
        
        function renderAIResults(result, query) {
            if (aiPlaceholder) aiPlaceholder.style.display = 'none';
            
            if (!result.success || result.results.length === 0) {
                aiResults.innerHTML = `
                    <div class="text-center py-8">
                        <div class="text-4xl mb-3">🤔</div>
                        <p class="text-gray-500 dark:text-gray-400">没有找到匹配的网站</p>
                        <p class="text-xs text-gray-400 dark:text-gray-500 mt-2">试试换个说法，或者用关键词搜索</p>
                    </div>`;
                return;
            }
            
            const { results, mode, reason } = result;
            const modeBadge = mode === 'llm'
                ? '<span class="inline-flex items-center gap-1 text-[10px] px-2 py-0.5 rounded-full bg-primary text-white ml-auto">✨ AI 精选</span>'
                : '<span class="inline-flex items-center gap-1 text-[10px] px-2 py-0.5 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 ml-auto">本地搜索</span>';
            const fallbackNote = (mode === 'local' && reason)
                ? `<div class="mb-2 text-xs text-amber-600 dark:text-amber-400">AI 推荐暂时不可用，已降级为本地搜索（${reason}）</div>`
                : '';
            
            aiResults.innerHTML = `
                ${fallbackNote}
                <div class="mb-3 flex items-center gap-2 text-xs text-gray-400 dark:text-gray-500">
                    找到 ${results.length} 个推荐
                    ${modeBadge}
                </div>
                ${results.map(({ site, localScore, reason, finalScore }) => `
                    <a href="${site.url}" target="_blank" rel="noopener noreferrer"
                        class="block mb-2 p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50 hover:bg-gray-100 dark:hover:bg-gray-700 border border-transparent hover:border-primary-light dark:hover:border-purple-700 transition-all group">
                        <div class="flex items-start gap-3">
                            <img src="https://icon.horse/icon/${new URL(site.url).hostname}" alt="" 
                                onerror="this.style.display='none'"
                                class="w-8 h-8 rounded-lg shrink-0 bg-white dark:bg-gray-800 p-1 border border-gray-200 dark:border-gray-600"
                                loading="lazy">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <h4 class="font-medium text-gray-900 dark:text-gray-100 truncate group-hover:text-primary-dark dark:group-hover:text-primary-light">${site.name}</h4>
                                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-primary-bg dark:bg-primary/40 text-primary-dark dark:text-primary-light shrink-0">${(finalScore * 100).toFixed(0)}%</span>
                                </div>
                                ${reason ? `<p class="text-xs text-primary-dark dark:text-primary-light mb-1">💡 ${reason}</p>` : ''}
                                <p class="text-xs text-gray-500 dark:text-gray-400 line-clamp-2">${site.description || ''}</p>
                                <div class="mt-1 flex items-center gap-2 text-[10px] text-gray-400 dark:text-gray-500">
                                    <span>${site.category || site.source || ''}</span>
                                    <span>·</span>
                                    <span class="truncate">${new URL(site.url).hostname}</span>
                                </div>
                            </div>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300 dark:text-gray-600 group-hover:text-primary transition-colors shrink-0"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
                        </div>
                    </a>
                `).join('')}
            `;
        }
        
        // 初始化
        init();
    </script>
</body>
</html>
