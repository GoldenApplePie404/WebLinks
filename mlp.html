<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');

        body {
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, #ffd6e7 0%, #c1f3ff 100%);
            color: #5a3d5a;
        }

        .mlp-header {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(255, 105, 180, 0.2);
            border: 3px solid white;
        }

        .mlp-title {
            text-shadow: 3px 3px 0 #ffb6c1, 6px 6px 0 rgba(255, 255, 255, 0.5);
            color: #8a2be2;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .mlp-subtitle {
            animation: rainbow 8s linear infinite;
            font-weight: 700;
        }

        @keyframes rainbow {
            0% {
                color: #ff9a9e;
            }

            14% {
                color: #fad0c4;
            }

            28% {
                color: #fbc2eb;
            }

            42% {
                color: #a6c1ee;
            }

            57% {
                color: #84fab0;
            }

            71% {
                color: #8fd3f4;
            }

            85% {
                color: #a1c4fd;
            }

            100% {
                color: #ff9a9e;
            }
        }

        .mlp-button {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            border: 2px solid white;
            border-radius: 50px;
            box-shadow: 0 4px 8px rgba(255, 105, 180, 0.3);
            transition: all 0.3s ease;
            color: white;
            font-weight: bold;
            font-size: large;
        }

        .mlp-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 16px rgba(255, 105, 180, 0.4);
        }

        .mlp-section {
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            border: 3px solid #ffb6c1;
            box-shadow: 0 8px 16px rgba(255, 105, 180, 0.2);
            transition: all 0.3s ease;
        }

        .mlp-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(255, 105, 180, 0.3);
        }

        .mlp-site-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            border-radius: 15px;
            border: 2px dashed #ffb6c1;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-size: 20px;
        }

        .mlp-site-card::before {
            content: "";
            position: absolute;
            top: -10px;
            right: -10px;
            width: 40px;
            height: 40px;
            background-color: #ff9a9e;
            transform: rotate(45deg);
            z-index: 1;
        }

        .mlp-site-card::after {
            content: "★";
            position: absolute;
            top: 5px;
            right: 5px;
            color: white;
            font-size: 14px;
            z-index: 2;
        }

        .mlp-site-card:hover {
            transform: scale(1.03) rotate(1deg);
            box-shadow: 0 8px 16px rgba(255, 105, 180, 0.3);
        }

        .mlp-site-title {
            color: #8a2be2;
            font-weight: bold;
            border-bottom: 2px dotted #ffb6c1;
            padding-bottom: 5px;
            font-size: 20px;
        }

        .mlp-site-link {
            color: #ff69b4;
            transition: all 0.3s ease;
        }

        .mlp-site-link:hover {
            color: #8a2be2;
            text-decoration: underline;
        }

        .mlp-category {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: white;
            border-radius: 50px;
            display: inline-block;
            padding: 5px 15px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(255, 105, 180, 0.3);
            border: 2px solid white;
            font-size: 23px;
        }

        .mlp-sidebar {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            border: 3px solid #ffb6c1;
            box-shadow: 0 8px 16px rgba(255, 105, 180, 0.2);
            position: sticky;
            top: 20px;
            font-size: 18px;
        }

        .mlp-sidebar-title {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 25px;
        }

        .mlp-sidebar-link {
            color: #8a2be2;
            transition: all 0.3s ease;
            display: block;
            padding: 8px 15px;
            border-bottom: 1px dashed #ffb6c1;
            font-size: 20px;
        }

        .mlp-sidebar-link:hover {
            background-color: rgba(255, 182, 193, 0.2);
            transform: translateX(5px);
        }


        @media (max-width: 768px) {
            .mlp-sidebar {
                position: static;
                margin-bottom: 20px;
            }
        }

</head>

        // 平滑滚动函数
        function scrollToSection(sectionId) {
            const section = document.getElementById(sectionId);
            if (section) {
                section.scrollIntoView({
                    behavior: 'smooth'
                });
            }
        }
        document.addEventListener('DOMContentLoaded', function () {
            const links = document.querySelectorAll('.mlp-sidebar-link');
            links.forEach(link => {
                link.addEventListener('click', function (event) {
                    event.preventDefault(); // 阻止默认锚点跳转行为
                    const sectionId = this.getAttribute('href').substring(1); // 获取锚点ID（去掉前导的#）
                    const section = document.getElementById(sectionId);
                    if (section) {
                        section.scrollIntoView({ behavior: 'smooth' }); // 调用平滑滚动
                    }
                });
            });
        });
        // 为所有卡片添加随机颜色标记

            cards.forEach(card => {
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                card.querySelector('.mlp-site-title').style.borderBottomColor = randomColor;

                // 为每个卡片添加悬停动画
                card.addEventListener('mouseenter', function () {
                    this.style.transform = 'scale(1.03) rotate(1deg)';
                });

                card.addEventListener('mouseleave', function () {
                    this.style.transform = 'scale(1) rotate(0)';
                });
            });
        });
